name: Source Rebuild CI

on:
  push:
    branches:
      - source-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Chromium for visual QA
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ldu-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ldu.sa/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ldu-preview.log
          exit 1

      - name: Capture visual QA
        run: npm run visual-qa

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: ldu-source-rebuild-dist
          path: dist/
          if-no-files-found: error

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ldu-visual-qa
          path: visual-qa/
          if-no-files-found: error
